name: Build signed Android artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Install signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/rigb-release.keystore
          test -s android/app/rigb-release.keystore
          printf '\n' >> android/gradle.properties
          cat >> android/gradle.properties <<'PROPERTIES'
          MYAPP_UPLOAD_STORE_FILE=rigb-release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          PROPERTIES

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          marker = "    signingConfigs {\n"
          signing = '''    signingConfigs {
                  release {
                      if (project.hasProperty("MYAPP_UPLOAD_STORE_FILE")) {
                          storeFile file(MYAPP_UPLOAD_STORE_FILE)
                          storePassword MYAPP_UPLOAD_STORE_PASSWORD
                          keyAlias MYAPP_UPLOAD_KEY_ALIAS
                          keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                      }
                  }
          '''
          if marker not in text:
              raise SystemExit("signingConfigs block not found")
          text = text.replace(marker, signing, 1)
          if "signingConfig signingConfigs.release" not in text:
              text = text.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          path.write_text(text)
          PY
          grep -n "MYAPP_UPLOAD\|signingConfig signingConfigs.release" android/app/build.gradle android/gradle.properties

      - name: Build signed APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: rigb-recharge-global-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: rigb-recharge-global-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
